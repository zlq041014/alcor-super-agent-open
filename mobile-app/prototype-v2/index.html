<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6657d9">
  <title>星引 Alcor · 手机个人助手设计原型</title>
  <link rel="icon" href="assets/app-icon-a.png">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <header class="proto-bar">
    <div class="brand"><img src="assets/app-icon-a.png" alt=""><div><b>星引 · 手机个人助手</b><small>设计原型：不连接模型或电脑，内容都是示例</small></div></div>
    <div class="tabs" id="tabs" role="tablist">
      <button id="tab-proto" data-view="proto" role="tab" aria-selected="true">可点击原型</button>
      <button id="tab-board" data-view="board" role="tab" aria-selected="false">全景</button>
      <button id="tab-spec" data-view="spec" role="tab" aria-selected="false">设计规范</button>
    </div>
    <span class="bar-sp"></span>
    <label class="sw"><input type="checkbox" id="ctl-dark">深色</label>
    <label class="sw"><input type="checkbox" id="ctl-reduce">减弱动画</label>
  </header>

  <div class="stage" id="view-proto">
    <aside class="guide" aria-label="场景导览"><nav id="scenarios"></nav></aside>
    <main class="device-wrap">
      <div class="device" id="device">
        <div class="statusbar" id="statusbar" aria-hidden="true"></div>
        <div class="app" id="app"></div>
        <div class="gesture" aria-hidden="true"><i></i></div>
      </div>
    </main>
    <aside class="notes" aria-label="设计说明与模拟控制">
      <section class="note-card" id="note"></section>
      <section class="note-card controls">
        <h2>模拟环境 <small>仅原型</small></h2>
        <label class="sw"><input type="checkbox" id="ctl-net" checked>手机网络</label>
        <div class="simrow"><span id="sim-work">LAPTOP-8F2M4C</span><div class="pseg" id="ctl-work"><button data-v="off">离线</button><button data-v="direct">直连</button><button data-v="relay">中继</button></div></div>
        <div class="simrow"><span id="sim-home">家里台式机</span><div class="pseg" id="ctl-home"><button data-v="off">离线</button><button data-v="direct">直连</button><button data-v="relay">中继</button><button data-v="tunnel">隧道</button></div></div>
        <div class="simrow"><span>时间</span><div class="pseg" id="ctl-part"><button data-v="am" data-t="10:24">上午</button><button data-v="pm" data-t="15:10">下午</button><button data-v="eve" data-t="19:42">晚上</button></div></div>
        <label class="sw"><input type="checkbox" id="ctl-sleep">很久没操作（小引休眠）</label>
      </section>
      <section class="note-card controls" id="evidence"></section>
      <section class="note-card" id="petpanel"></section>
    </aside>
  </div>
  <div class="board" id="view-board" hidden></div>
  <div class="spec" id="view-spec" hidden></div>
  <button class="guide-fab" id="guide-fab" type="button" aria-label="打开场景导览">场景</button>

  <script src="assets/pet/pet-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens-main.js"></script>
  <script src="js/screens-notes.js"></script>
  <script src="js/screens-work.js"></script>
  <script src="js/screens-self.js"></script>
  <script src="js/screens-life.js"></script>
  <script src="js/screens-out.js"></script>
  <script src="js/screens-pet.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/spec.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
