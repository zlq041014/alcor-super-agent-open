<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星引桌宠「小引」预览</title>
<style>
  :root { --accent: #6657d9; --ink: #1d2033; --muted: #5f6478; --line: #e8eaf2; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; color: var(--ink); background: #f7f8fc; display: grid; grid-template-columns: 300px 1fr; height: 100vh; overflow: hidden; }
  aside { border-right: 1px solid var(--line); background: #fff; padding: 16px; overflow: auto; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .group { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  button.state { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; margin: 0 0 6px; cursor: pointer; font: inherit; }
  button.state b { font-weight: 600; }
  button.state small { display: block; color: var(--muted); font-size: 12px; }
  button.state[aria-pressed="true"] { border-color: var(--accent); background: #efecff; }
  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .bar { display: flex; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  .bar button { font: inherit; border: 1px solid var(--accent); color: #fff; background: var(--accent); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .stage { position: relative; display: grid; place-items: center; overflow: hidden; }
  .stage.light { background: #eef0f6; }
  .stage.dark { background: #15161f; }
  .stage.desk { background: linear-gradient(135deg, #1f4f7a, #3a7ca5 45%, #d9a066); }
  .stage.checker { background: repeating-conic-gradient(#e6e6ea 0 25%, #fafafa 0 50%) 0 0 / 24px 24px; }
  canvas { image-rendering: pixelated; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .status { padding: 10px 20px; border-top: 1px solid var(--line); background: #fff; color: var(--muted); min-height: 44px; }
  .status b { color: var(--ink); }
  .strip { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 20px 12px; background: #fff; }
  .strip canvas { border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .strip canvas.on { border-color: var(--accent); }
</style>
</head>
<body>
<aside>
  <h1>星引桌宠「小引」</h1>
  <p class="note">设计预览：动作切换和下方「演示派工」都由页面模拟，不连接 Hub 或执行端。单击桌宠播放「戳一下」，按住拖动播放「拖动」。</p>
  <div id="list"></div>
</aside>
<main>
  <div class="bar">
    <label>缩放 <select id="scale"><option>2</option><option selected>3</option><option>4</option><option>6</option></select></label>
    <label>背景 <select id="bg"><option value="light">浅色</option><option value="dark">深色</option><option value="desk" selected>桌面</option><option value="checker">透明格</option></select></label>
    <label><input type="checkbox" id="reduce"> 减弱动画</label>
    <button id="demo">演示派工（模拟回执）</button>
  </div>
  <div class="stage desk" id="stage"><canvas id="pet"></canvas></div>
  <div>
    <div class="status" id="status"></div>
    <div class="strip" id="strip"></div>
  </div>
</main>
<script src="preview-data.js"></script>
<script>
const META = window.ALCOR_PET;
const FW = META.frameWidth, FH = META.frameHeight;
const GROUPS = [
  ['常驻', ['idle', 'sleep']],
  ['对话（总管）', ['listen', 'think', 'talk']],
  ['工作（按真实回执）', ['queued', 'handoff', 'received', 'working', 'unknown', 'review', 'done', 'failed']],
  ['互动', ['poke', 'drag']],
];
const sheet = new Image();
sheet.src = '../../assets/pet/' + META.image;
const cv = document.getElementById('pet'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let cur = 'idle', frame = 0, last = 0, base = 'idle', dragging = false, demoTimers = [];

function sizeCanvas() {
  const s = +$('scale').value;
  cv.width = FW; cv.height = FH;
  cv.style.width = FW * s + 'px'; cv.style.height = FH * s + 'px';
}
function play(name, keepBase) {
  cur = name; frame = 0; last = 0;
  if (!keepBase && META.animations[name].loop) base = name;
  document.querySelectorAll('button.state').forEach(b => b.setAttribute('aria-pressed', b.dataset.name === name));
  const a = META.animations[name];
  $('status').innerHTML = `<b>${a.label}</b>（${name}，${a.frames} 帧 · ${a.fps} fps · ${a.loop ? '循环' : '播放一次后转入 ' + (a.next || '原状态')}）　${a.trigger}`;
  drawStrip();
}
function drawFrame(c, name, f) {
  const a = META.animations[name], g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, FW, FH);
  g.drawImage(sheet, f * FW, a.row * FH, FW, FH, 0, 0, FW, FH);
}
function drawStrip() {
  const a = META.animations[cur], box = $('strip');
  box.innerHTML = '';
  for (let i = 0; i < a.frames; i++) {
    const c = document.createElement('canvas');
    c.width = FW; c.height = FH; c.style.width = FW + 'px'; c.style.height = FH + 'px';
    c.dataset.i = i;
    if (sheet.complete) drawFrame(c, cur, i);
    box.appendChild(c);
  }
}
function tick(t) {
  const a = META.animations[cur];
  const fps = $('reduce').checked ? Math.min(a.fps, 4) : a.fps;
  if (!last) last = t;
  if (t - last >= 1000 / fps) {
    last = t;
    if ($('reduce').checked && (cur === 'idle' || cur === 'sleep')) frame = 0;
    else if (frame + 1 < a.frames) frame++;
    else if (a.loop) frame = 0;
    else play(a.next || base);
  }
  if (sheet.complete) drawFrame(cv, cur, frame);
  document.querySelectorAll('#strip canvas').forEach(c => c.classList.toggle('on', +c.dataset.i === frame));
  requestAnimationFrame(tick);
}

const list = $('list');
for (const [title, names] of GROUPS) {
  const h = document.createElement('div'); h.className = 'group'; h.textContent = title; list.appendChild(h);
  for (const n of names) {
    const a = META.animations[n], b = document.createElement('button');
    b.className = 'state'; b.dataset.name = n;
    b.innerHTML = `<b>${a.label}</b> <code>${n}</code><small>${a.trigger}</small>`;
    b.onclick = () => { stopDemo(); play(n); };
    list.appendChild(b);
  }
}
$('scale').onchange = sizeCanvas;
$('bg').onchange = () => { $('stage').className = 'stage ' + $('bg').value; };

let downAt = null, origin = null;
cv.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; origin = { x: cv.offsetLeft, y: cv.offsetTop }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!downAt) return;
  const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
  if (!dragging && Math.hypot(dx, dy) > 4) { dragging = true; play('drag', true); }
  if (dragging) cv.style.transform = `translate(${dx}px, ${dy}px)`;
});
cv.addEventListener('pointerup', () => {
  if (dragging) { dragging = false; cv.style.transform = ''; play(base, true); }
  else if (downAt) play('poke', true);
  downAt = null;
});

function stopDemo() { demoTimers.forEach(clearTimeout); demoTimers = []; }
$('demo').onclick = () => {
  stopDemo();
  const steps = [
    [0, 'listen', '用户在输入'], [1800, 'think', '总管请求已发出'], [3600, 'talk', '总管回复中，给出交接卡'],
    [6000, 'queued', '用户点「交给电脑」；尚无回执'], [8500, 'handoff', '模拟：电脑「已收到」回执'],
    [11500, 'working', '模拟：回合开始证据'], [15000, 'review', '模拟：回合结束，有结果待验收'],
    [18000, 'done', '模拟：用户核对通过'],
  ];
  for (const [ms, name, why] of steps) demoTimers.push(setTimeout(() => {
    play(name);
    $('status').innerHTML += `<br>演示步骤：${why}`;
  }, ms));
};

sheet.onload = () => drawStrip();
sizeCanvas();
play('idle');
requestAnimationFrame(tick);
</script>
</body>
</html>
