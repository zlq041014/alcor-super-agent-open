<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>星引 · 安全密钥设置</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="credential">
    <h2>安全密钥设置</h2>
    <strong id="target"></strong>
    <p>
      密钥通过 Windows 用户级 DPAPI
      加密保存。普通聊天、任务、日志和备份均不包含密钥。
    </p>
    <label
      >当前端点的 API Key<input
        id="key"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="粘贴 API Key"
    /></label>
    <p id="error" role="alert"></p>
    <button id="save" class="primary">加密保存</button
    ><button id="cancel">取消</button>
    <script src="credential.js"></script>
  </body>
</html>
